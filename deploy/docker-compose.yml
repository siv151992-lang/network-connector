# WireMesh production deployment.
#
#   cp .env.example .env    # then edit: domain, passwords, secret key
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Services added in later phases (relay, web dashboard) are marked below.
name: wiremesh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiremesh
      POSTGRES_USER: wiremesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiremesh -d wiremesh"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    # Not published to the host. For local debugging only:
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    # Only needed when running more than one control-server replica (Phase 11).
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    profiles: ["ha"]
    networks: [backend]

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
      args:
        VERSION: ${WIREMESH_VERSION:-dev}
    image: wiremesh-server:${WIREMESH_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WIREMESH_ENV: ${WIREMESH_ENV:-production}
      WIREMESH_HTTP_ADDR: ":8080"
      WIREMESH_PUBLIC_URL: https://${WIREMESH_DOMAIN:?set WIREMESH_DOMAIN in .env}
      WIREMESH_DATABASE_URL: postgres://wiremesh:${POSTGRES_PASSWORD}@postgres:5432/wiremesh?sslmode=disable
      WIREMESH_SECRET_KEY: ${WIREMESH_SECRET_KEY:?set WIREMESH_SECRET_KEY in .env}
      # Docker's internal ranges: only Caddy can reach the server, so trust its X-Forwarded-For.
      WIREMESH_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      WIREMESH_LOG_LEVEL: ${WIREMESH_LOG_LEVEL:-info}
      WIREMESH_AUTO_MIGRATE: "true"
      WIREMESH_RATE_LIMIT_RPS: ${WIREMESH_RATE_LIMIT_RPS:-10}
      WIREMESH_RATE_LIMIT_BURST: ${WIREMESH_RATE_LIMIT_BURST:-30}
      WIREMESH_ALLOW_REGISTRATION: ${WIREMESH_ALLOW_REGISTRATION:-false}
      WIREMESH_REQUIRE_EMAIL_VERIFICATION: ${WIREMESH_REQUIRE_EMAIL_VERIFICATION:-true}
      WIREMESH_SMTP_HOST: ${WIREMESH_SMTP_HOST:-}
      WIREMESH_SMTP_PORT: ${WIREMESH_SMTP_PORT:-587}
      WIREMESH_SMTP_USERNAME: ${WIREMESH_SMTP_USERNAME:-}
      WIREMESH_SMTP_PASSWORD: ${WIREMESH_SMTP_PASSWORD:-}
      WIREMESH_SMTP_FROM: ${WIREMESH_SMTP_FROM:-}
      WIREMESH_SMTP_TLS: ${WIREMESH_SMTP_TLS:-starttls}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend, frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      WIREMESH_DOMAIN: ${WIREMESH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

  # relay:  (Phase 6) wiremesh-relay — UDP 3478 (STUN) + TCP 8443 (relay)
  # web:    (Phase 10) dashboard static build, served by caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true # postgres/redis get no internet access
  frontend:
