# Development database only. Run the server on the host with `make run`.
#   docker compose -f deploy/docker-compose.dev.yml up -d --wait
name: wiremesh-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiremesh
      POSTGRES_USER: wiremesh
      POSTGRES_PASSWORD: wiremesh
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiremesh"]
      interval: 3s
      retries: 20
volumes:
  pgdata-dev:
